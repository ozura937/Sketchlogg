<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SketchLog – Pantau Belajar Menggambar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #22223b;
  --border: #2d2d4e;
  --accent: #e8a838;
  --accent2: #f4c66a;
  --text: #f0eee8;
  --muted: #7a7a9a;
  --week1: #5c3d1e;
  --week1b: #f4a261;
  --week2: #1a3a4a;
  --week2b: #48cae4;
  --week3: #1a3a2a;
  --week3b: #52b788;
  --week4: #2d1a4a;
  --week4b: #c77dff;
  --rest: #2a2a2a;
  --restb: #aaaaaa;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── noise overlay ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0;
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,26,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
.logo span { color: var(--muted); font-weight: 400; }
.streak-badge {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #3d2a00, #5c3d00);
  border: 1px solid var(--accent);
  border-radius: 20px; padding: 5px 12px;
  font-family: 'Space Mono', monospace; font-size: 12px; color: var(--accent);
}

/* ── NAV TABS ── */
.tabs {
  display: flex; overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1; min-width: 70px;
  padding: 12px 8px; text-align: center;
  font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
  color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s; white-space: nowrap;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── PAGES ── */
.page { display: none; padding: 20px 16px 100px; position: relative; z-index: 1; }
.page.active { display: block; }

/* ── TODAY CARD ── */
.today-hero {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.today-hero::before {
  content: '';
  position: absolute; top: -40px; right: -40px;
  width: 150px; height: 150px;
  background: radial-gradient(circle, rgba(232,168,56,0.12) 0%, transparent 70%);
  border-radius: 50%;
}
.day-label { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
.day-title { font-size: 20px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
.day-cat {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 3px 10px; border-radius: 20px; margin-bottom: 14px;
}
.day-goal { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 18px; }

.done-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #2d4a1e, #3d6428);
  border: 1px solid #52b788;
  border-radius: var(--radius-sm);
  color: #52b788; font-family: 'Sora', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all 0.2s;
}
.done-btn:active { transform: scale(0.98); }
.done-btn.completed {
  background: linear-gradient(135deg, #1a3a1a, #224422);
  color: #52b788;
}
.undone-btn {
  width: 100%; padding: 10px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--muted); font-family: 'Sora', sans-serif;
  font-size: 12px; cursor: pointer; margin-top: 8px;
  transition: all 0.2s;
}

/* ── STEPS ── */
.section-title {
  font-family: 'Space Mono', monospace;
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin: 20px 0 10px;
}
.steps-list { display: flex; flex-direction: column; gap: 8px; }
.step-item {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px;
}
.step-num {
  min-width: 24px; height: 24px;
  background: var(--accent); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace; font-size: 11px;
  font-weight: 700; color: #000;
}
.step-text { font-size: 13px; line-height: 1.6; color: var(--text); }

/* ── TIP BOX ── */
.tip-box {
  background: linear-gradient(135deg, #2a2400, #3a3200);
  border: 1px solid #5a4a00;
  border-radius: var(--radius-sm);
  padding: 14px; margin-top: 16px;
}
.tip-label { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.tip-text { font-size: 13px; color: #c8b070; line-height: 1.6; }

/* ── YOUTUBE LINKS ── */
.yt-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.yt-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px;
  text-decoration: none;
}
.yt-icon {
  min-width: 32px; height: 32px; background: #cc0000;
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 14px;
}
.yt-text { font-size: 12px; color: var(--text); line-height: 1.4; }

/* ── CALENDAR ── */
.week-group { margin-bottom: 24px; }
.week-label {
  font-family: 'Space Mono', monospace; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 6px 12px; border-radius: 20px;
  display: inline-block; margin-bottom: 10px;
}
.day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-day {
  aspect-ratio: 1; border-radius: 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; border: 1.5px solid transparent;
  transition: all 0.15s; position: relative;
  background: var(--surface);
}
.cal-day .cn { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; }
.cal-day .ci { font-size: 8px; color: var(--muted); margin-top: 1px; }
.cal-day.done { background: #1a3a1a; border-color: #52b788; }
.cal-day.done .cn { color: #52b788; }
.cal-day.today { border-color: var(--accent) !important; }
.cal-day.rest-day { opacity: 0.5; }
.cal-day.future { opacity: 0.4; cursor: default; }

/* ── PROGRESS ── */
.progress-ring-wrap { display: flex; justify-content: center; margin: 24px 0; }
svg.ring { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--surface2); stroke-width: 12; }
.ring-fill { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
.ring-pct { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; color: var(--accent); }
.ring-sub { font-size: 12px; color: var(--muted); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 16px; text-align: center;
}
.stat-val { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

.week-bars { display: flex; flex-direction: column; gap: 10px; }
.week-bar-row { display: flex; align-items: center; gap: 10px; }
.week-bar-label { font-size: 12px; color: var(--muted); width: 80px; flex-shrink: 0; }
.week-bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.week-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
.week-bar-num { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); width: 40px; text-align: right; flex-shrink: 0; }

/* ── REMINDER ── */
.reminder-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.time-display {
  font-family: 'Space Mono', monospace; font-size: 48px;
  font-weight: 700; color: var(--accent); text-align: center;
  margin: 16px 0; letter-spacing: -2px;
}
.time-inputs { display: flex; gap: 10px; margin-bottom: 16px; }
.time-inputs input[type=number] {
  flex: 1; padding: 12px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: 'Space Mono', monospace;
  font-size: 24px; text-align: center; -moz-appearance: textfield;
}
.time-inputs input::-webkit-outer-spin-button,
.time-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; }
.time-sep { font-family: 'Space Mono', monospace; font-size: 30px; color: var(--muted); display: flex; align-items: center; }
.toggle-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #3d2a00, #5c3d00);
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  color: var(--accent); font-family: 'Sora', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.toggle-btn.on { background: linear-gradient(135deg, #2d4a1e, #3d6428); border-color: #52b788; color: #52b788; }
.toggle-btn:active { transform: scale(0.98); }

.notif-status {
  margin-top: 12px; padding: 10px 14px;
  border-radius: var(--radius-sm); font-size: 13px; text-align: center;
}
.notif-status.on { background: #1a3a1a; color: #52b788; border: 1px solid #52b788; }
.notif-status.off { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

.timer-section { margin-top: 20px; }
.timer-display {
  font-family: 'Space Mono', monospace; font-size: 60px;
  font-weight: 700; text-align: center; color: var(--text);
  letter-spacing: -3px; margin: 16px 0;
  transition: color 0.3s;
}
.timer-display.running { color: var(--accent2); }
.timer-display.done-t { color: #52b788; }
.timer-btns { display: flex; gap: 10px; }
.timer-btns button {
  flex: 1; padding: 14px;
  border-radius: var(--radius-sm);
  font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; border: 1px solid;
}
.btn-start { background: linear-gradient(135deg, #3d2a00, #5c3d00); border-color: var(--accent); color: var(--accent); }
.btn-reset { background: var(--surface2); border-color: var(--border); color: var(--muted); }
.timer-btns button:active { transform: scale(0.97); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: rgba(26,26,46,0.96); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
}
.bnav-item {
  flex: 1; padding: 10px 4px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; transition: all 0.2s;
}
.bnav-icon { font-size: 22px; }
.bnav-label { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; }
.bnav-item.active .bnav-label { color: var(--accent); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 30px; padding: 10px 20px;
  font-size: 13px; font-weight: 600;
  opacity: 0; transition: all 0.3s; z-index: 500; white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── ANIM ── */
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.page.active > * { animation: fadeIn 0.3s ease both; }
.page.active > *:nth-child(1) { animation-delay: 0s; }
.page.active > *:nth-child(2) { animation-delay: 0.05s; }
.page.active > *:nth-child(3) { animation-delay: 0.1s; }
</style>
</head>
<body>

<header>
  <div class="logo">Sketch<span>Log</span></div>
  <div class="streak-badge">🔥 <span id="streakNum">0</span> hari streak</div>
</header>

<!-- bottom nav -->
<nav class="bottom-nav">
  <div class="bnav-item active" onclick="showPage('today')">
    <div class="bnav-icon">📋</div>
    <div class="bnav-label">Hari Ini</div>
  </div>
  <div class="bnav-item" onclick="showPage('calendar')">
    <div class="bnav-icon">📅</div>
    <div class="bnav-label">Kalender</div>
  </div>
  <div class="bnav-item" onclick="showPage('progress')">
    <div class="bnav-icon">📊</div>
    <div class="bnav-label">Progress</div>
  </div>
  <div class="bnav-item" onclick="showPage('reminder')">
    <div class="bnav-icon">⏰</div>
    <div class="bnav-label">Reminder</div>
  </div>
</nav>

<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════ PAGE: TODAY -->
<div class="page active" id="page-today"></div>

<!-- ═══════════════════════════════════════════════ PAGE: CALENDAR -->
<div class="page" id="page-calendar"></div>

<!-- ═══════════════════════════════════════════════ PAGE: PROGRESS -->
<div class="page" id="page-progress"></div>

<!-- ═══════════════════════════════════════════════ PAGE: REMINDER -->
<div class="page" id="page-reminder">
  <p class="section-title">Atur Jam Latihan Harian</p>
  <div class="reminder-card">
    <div class="time-inputs">
      <input type="number" id="rHour" min="0" max="23" value="19" placeholder="19">
      <div class="time-sep">:</div>
      <input type="number" id="rMin" min="0" max="59" value="0" placeholder="00">
    </div>
    <div class="time-display" id="timePreview">19:00</div>
    <button class="toggle-btn" id="reminderToggle" onclick="toggleReminder()">🔔 Aktifkan Pengingat</button>
    <div class="notif-status off" id="notifStatus">Pengingat belum aktif</div>
  </div>

  <p class="section-title">Timer Latihan</p>
  <div class="reminder-card timer-section">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button onclick="setDuration(30)" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">30 menit</button>
      <button onclick="setDuration(45)" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">45 menit</button>
      <button onclick="setDuration(60)" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;">60 menit</button>
    </div>
    <div class="timer-display" id="timerDisplay">30:00</div>
    <div class="timer-btns">
      <button class="btn-start" id="timerStartBtn" onclick="timerToggle()">▶ Mulai</button>
      <button class="btn-reset" onclick="timerReset()">↺ Reset</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════ DATA ═══════════════════════
const DAYS = [
  {w:1,title:"Garis & Tekanan Pensil",cat:"Fondasi & Teknik",goal:"Melatih kontrol tangan dan konsistensi goresan pensil",
   steps:["Gambar 50 garis horizontal lurus tanpa penggaris — fokus konsistensi kiri ke kanan","Gambar 50 garis vertikal dari atas ke bawah","Gambar 50 garis diagonal 45 derajat","Buat gradient strip: tekanan ringan di kiri, tambah ke kanan hingga sangat gelap","Latihan hatching dasar: kotak 3x3 cm, isi dengan garis paralel rapat","Ulangi latihan garis dengan mata setengah terpejam untuk mengurangi kontrol berlebih"],
   tip:"Gerakkan tangan dari siku/bahu, BUKAN dari jari. Jari hanya memegang pensil. Bayangkan sedang menari di atas kertas.",
   yt:[["How to Draw Straight Lines","https://youtu.be/evdxbHjDVqI"],["Line Weight & Pressure - Proko","https://youtu.be/7GmCPnuHVlQ"],["Fundamental Drawing Skills","https://youtu.be/Qj1FK9AxJZM"]]},
  {w:1,title:"Lingkaran & Elips",cat:"Fondasi & Teknik",goal:"Menguasai bentuk oval sebagai dasar objek 3D",
   steps:["Putar kertas 90 derajat, gambar 20 lingkaran dari gerakan bahu (bukan jari)","Gambar elips dari berbagai sudut: sangat gepeng, setengah gepeng, hampir bulat","Gambar silinder: 2 elips paralel, hubungkan dengan garis lurus","Gambar bola: lingkaran + garis kontur melengkung di tengah","Tambahkan arsiran sederhana pada bola — area gelap berlawanan sumber cahaya","Gambar 5 objek silindris: botol minum, kaleng, gelas"],
   tip:"Ghost drawing: sebelum menarik garis lingkaran, gerakkan pensil di udara beberapa kali mengikuti jalur. Setelah otot 'hafal', baru taruh pensil ke kertas.",
   yt:[["How to Draw Circles and Ellipses","https://youtu.be/IfFLJd0_kgE"],["Drawing Cylinders and Spheres","https://youtu.be/2gHcFYpfQbA"],["Basic Forms Tutorial - Ctrl+Paint","https://youtu.be/Ykq_9JhVFxU"]]},
  {w:1,title:"Kotak & Perspektif Dasar",cat:"Fondasi & Teknik",goal:"Memahami cara kerja ruang 3D pada bidang 2D",
   steps:["Gambar garis horizon di tengah kertas (eye level)","Tandai 1 titik di tengah sebagai vanishing point","Gambar kotak depan, tarik garis dari pojok ke vanishing point","Tutup sisi belakang — selesai! Ulangi 5 kali berbeda ukuran","2-point perspective: 2 vanishing point di ujung kiri-kanan horizon","Gambar 3 kotak 2-point dari sudut berbeda","Tantangan: gambar meja sederhana dalam 1-point perspective"],
   tip:"Semua perspektif bermula dari EYE LEVEL. Pahami ini dulu sebelum menghafal aturan teknis lainnya.",

  {w:1,title:"Tekstur & Hatching",cat:"Fondasi & Teknik",goal:"Teknik arsiran untuk menciptakan gelap-terang",
   steps:["Buat kotak 2x2 cm, isi hatching paralel sangat rapat (gelap)","Buat kotak lain dengan hatching renggang (terang)","Buat gradient strip hatching: renggang ke rapat","Cross-hatching: lapisan pertama horizontal, lapisan kedua diagonal 45°","Stippling: titik rapat untuk gelap, jarang untuk terang","Gambar kubus dengan 3 sisi berbeda value","Tambahkan cast shadow di bawah kubus"],
   tip:"Jangan menekan keras untuk area gelap dengan 1 lapisan. Buat 3-4 lapisan ringan yang ditumpuk. Teknik ini disebut 'building up value'.",

  {w:1,title:"Bentuk Organik",cat:"Fondasi & Teknik",goal:"Menggambar bentuk tidak geometris dari alam",

   steps:["Review semua gambar 30 hari — identifikasi 3 weakness utama","Pilih 1 fokus untuk Bulan 2 (anatomi, perspektif arsitektur, atau portrait)","Cari resource untuk fokus tersebut (buku, YouTube, course)","Set jadwal latihan yang bisa dipertahankan","Cari komunitas atau accountability partner untuk Bulan 2","Rayakan pencapaian 30 hari! Kamu luar biasa 🎉"],
   tip:"Resource terbaik: Proko.com, Ctrl+Paint.com, buku 'Drawing on the Right Side of the Brain' oleh Betty Edwards (klasik wajib baca).",
   yt:[["How to Improve at Drawing Faster","https://youtu.be/Gjzq_8EY4g0"],["Your Art Learning Path","https://youtu.be/YQs5g0P4pNE"],["1 Year of Daily Drawing Results","https://youtu.be/LRcRPnHHAqU"]]},
];

const CAT_COLORS = {
  "Fondasi & Teknik": {bg:"var(--week1)",c:"var(--week1b)"},
  "Bentuk & Proporsi": {bg:"var(--week2)",c:"var(--week2b)"},
  "Observasi & Komposisi": {bg:"var(--week3)",c:"var(--week3b)"},
  "Eksplorasi & Gaya": {bg:"var(--week4)",c:"var(--week4b)"},
  "Istirahat Aktif": {bg:"var(--rest)",c:"var(--restb)"},
};
const WEEK_LABELS = ["","Minggu 1 — Fondasi & Teknik","Minggu 2 — Bentuk & Proporsi","Minggu 3 — Observasi & Komposisi","Minggu 4 — Eksplorasi & Gaya"];
const WEEK_COLORS = {1:{bg:"var(--week1)",c:"var(--week1b)"},2:{bg:"var(--week2)",c:"var(--week2b)"},3:{bg:"var(--week3)",c:"var(--week3b)"},4:{bg:"var(--week4)",c:"var(--week4b)"}};

// ═══════════════════════ STATE ═══════════════════════
function loadState() {
  try { return JSON.parse(localStorage.getItem('sketchlog') || '{}'); } catch { return {}; }
}
function saveState(s) { localStorage.setItem('sketchlog', JSON.stringify(s)); }

let state = loadState();
if (!state.done) state.done = {};
if (!state.startDate) { state.startDate = new Date().toISOString().slice(0,10); saveState(state); }

function isDone(dayIdx) { return !!state.done[dayIdx]; }
function markDone(dayIdx, val) {
  if (val) state.done[dayIdx] = new Date().toISOString();
  else delete state.done[dayIdx];
  saveState(state);
}

function getTodayIdx() {
  const start = new Date(state.startDate);
  const now = new Date();
  const diff = Math.floor((now - start) / 86400000);
  return Math.max(0, Math.min(diff, 29));
}

function getStreak() {
  let streak = 0;
  const today = getTodayIdx();
  for (let i = today; i >= 0; i--) {
    if (isDone(i)) streak++;
    else break;
  }
  return streak;
}

// ═══════════════════════ NAV ═══════════════════════
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  const map = {today:0,calendar:1,progress:2,reminder:3};
  document.querySelectorAll('.bnav-item')[map[id]].classList.add('active');
  if (id === 'today') renderToday();
  if (id === 'calendar') renderCalendar();
  if (id === 'progress') renderProgress();
}

// ═══════════════════════ TODAY ═══════════════════════
function renderToday() {
  const idx = getTodayIdx();
  const d = DAYS[idx];
  const done = isDone(idx);
  const cc = CAT_COLORS[d.cat];

  const stepsHTML = d.steps.map((s,i) => `
    <div class="step-item">
      <div class="step-num">${i+1}</div>
      <div class="step-text">${s}</div>
    </div>`).join('');

  const ytHTML = d.yt.map(([name,url]) => `
    <a class="yt-item" href="${url}" target="_blank" rel="noopener">
      <div class="yt-icon">▶</div>
      <div class="yt-text">${name}</div>
    </a>`).join('');

  const doneBtnTxt = done ? '✅ Sudah Selesai Hari Ini!' : '✓ Tandai Selesai Hari Ini';

  document.getElementById('page-today').innerHTML = `
    <div class="today-hero">
      <div class="day-label">Hari ${idx+1} dari 30</div>
      <div class="day-title">${d.title}</div>
      <span class="day-cat" style="background:${cc.bg};color:${cc.c}">${d.cat}</span>
      <div class="day-goal">${d.goal}</div>
      <button class="done-btn ${done?'completed':''}" onclick="toggleDone(${idx})">${doneBtnTxt}</button>
      ${done ? `<button class="undone-btn" onclick="undoDone(${idx})">Batalkan</button>` : ''}
    </div>

    <p class="section-title">📝 Langkah Latihan</p>
    <div class="steps-list">${stepsHTML}</div>

    <div class="tip-box">
      <div class="tip-label">💡 Tips Profesional</div>
      <div class="tip-text">${d.tip}</div>
    </div>

    <p class="section-title">🎥 Video YouTube</p>
    <div class="yt-list">${ytHTML}</div>
  `;
  document.getElementById('streakNum').textContent = getStreak();
}

function toggleDone(idx) {
  if (isDone(idx)) return;
  markDone(idx, true);
  toast('🎉 Hari ' + (idx+1) + ' selesai! Keren!');
  setTimeout(() => renderToday(), 300);
}
function undoDone(idx) {
  markDone(idx, false);
  toast('Dibatalkan');
  renderToday();
}

// ═══════════════════════ CALENDAR ═══════════════════════
function renderCalendar() {
  const todayIdx = getTodayIdx();
  let html = '';
  for (let w = 1; w <= 4; w++) {
    const wc = WEEK_COLORS[w];
    const dayIndices = DAYS.map((d,i) => d.w === w ? i : -1).filter(i => i >= 0);
    const cells = dayIndices.map(i => {
      const d = DAYS[i];
      const done = isDone(i);
      const isToday = i === todayIdx;
      const isFuture = i > todayIdx;
      const cls = ['cal-day', done?'done':'', isToday?'today':'', isFuture?'future':'', d.cat==='Istirahat Aktif'?'rest-day':''].filter(Boolean).join(' ');
      return `<div class="${cls}" style="${done?'':'border-color:'+(isToday?'var(--accent)':'var(--border)')+''};" onclick="calTap(${i})">
        <div class="cn">${i+1}</div>
        <div class="ci">${done?'✅':isToday?'📌':'○'}</div>
      </div>`;
    }).join('');
    html += `
      <div class="week-group">
        <div class="week-label" style="background:${wc.bg};color:${wc.c}">${WEEK_LABELS[w]}</div>
        <div class="day-grid">${cells}</div>
      </div>`;
  }
  document.getElementById('page-calendar').innerHTML = html;
}

function calTap(idx) {
  const d = DAYS[idx];
  const todayIdx = getTodayIdx();
  if (idx > todayIdx) { toast('Belum waktunya!'); return; }
  if (!isDone(idx)) {
    markDone(idx, true);
    toast('✅ Hari ' + (idx+1) + ' ditandai selesai!');
    renderCalendar();
    document.getElementById('streakNum').textContent = getStreak();
  } else {
    markDone(idx, false);
    toast('Hari ' + (idx+1) + ' dibatalkan');
    renderCalendar();
    document.getElementById('streakNum').textContent = getStreak();
  }
}

// ═══════════════════════ PROGRESS ═══════════════════════
function renderProgress() {
  const total = DAYS.length;
  const done = Object.keys(state.done).length;
  const pct = Math.round((done / total) * 100);

  const weekDone = [0,0,0,0];
  const weekTotal = [0,0,0,0];
  DAYS.forEach((d,i) => {
    weekTotal[d.w-1]++;
    if (isDone(i)) weekDone[d.w-1]++;
  });

  const r = 70, circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;

  const weekBarsHTML = [1,2,3,4].map(w => {
    const wc = WEEK_COLORS[w];
    const wp = weekTotal[w-1] > 0 ? Math.round((weekDone[w-1]/weekTotal[w-1])*100) : 0;
    return `<div class="week-bar-row">
      <div class="week-bar-label" style="color:${wc.c};font-size:11px;font-weight:600">${WEEK_LABELS[w].split('—')[0]}</div>
      <div class="week-bar-track">
        <div class="week-bar-fill" style="width:${wp}%;background:${wc.c}"></div>
      </div>
      <div class="week-bar-num">${weekDone[w-1]}/${weekTotal[w-1]}</div>
    </div>`;
  }).join('');

  const streak = getStreak();
  const remaining = total - done;

  document.getElementById('page-progress').innerHTML = `
    <div class="progress-ring-wrap" style="position:relative;width:180px;height:180px;margin:0 auto 20px;">
      <svg class="ring" width="180" height="180" viewBox="0 0 180 180">
        <circle class="ring-track" cx="90" cy="90" r="${r}"/>
        <circle class="ring-fill" cx="90" cy="90" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="ring-center">
        <div class="ring-pct">${pct}%</div>
        <div class="ring-sub">${done}/${total} hari</div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-val">${done}</div>
        <div class="stat-label">Hari Selesai</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${streak}</div>
        <div class="stat-label">🔥 Streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${remaining}</div>
        <div class="stat-label">Sisa Hari</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${done > 0 ? Math.round(done * 45) : 0}</div>
        <div class="stat-label">Menit Latihan</div>
      </div>
    </div>

    <p class="section-title">Progress per Minggu</p>
    <div class="week-bars">${weekBarsHTML}</div>
  `;
}

// ═══════════════════════ REMINDER ═══════════════════════
let reminderInterval = null;
let reminderOn = false;

function updateTimePreview() {
  const h = String(document.getElementById('rHour').value).padStart(2,'0');
  const m = String(document.getElementById('rMin').value).padStart(2,'0');
  document.getElementById('timePreview').textContent = h + ':' + m;
}
document.getElementById('rHour').addEventListener('input', updateTimePreview);
document.getElementById('rMin').addEventListener('input', updateTimePreview);

function toggleReminder() {
  if (!reminderOn) {
    if (!('Notification' in window)) { toast('Browser tidak mendukung notifikasi'); return; }
    Notification.requestPermission().then(p => {
      if (p === 'granted') {
        reminderOn = true;
        startReminderCheck();
        const h = document.getElementById('rHour').value;
        const m = document.getElementById('rMin').value;
        document.getElementById('reminderToggle').textContent = '🔕 Matikan Pengingat';
        document.getElementById('reminderToggle').classList.add('on');
        document.getElementById('notifStatus').textContent = `✅ Pengingat aktif setiap hari pukul ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        document.getElementById('notifStatus').className = 'notif-status on';
        toast('🔔 Pengingat diaktifkan!');
      } else { toast('Izin notifikasi ditolak'); }
    });
  } else {
    reminderOn = false;
    if (reminderInterval) clearInterval(reminderInterval);
    document.getElementById('reminderToggle').textContent = '🔔 Aktifkan Pengingat';
    document.getElementById('reminderToggle').classList.remove('on');
    document.getElementById('notifStatus').textContent = 'Pengingat dimatikan';
    document.getElementById('notifStatus').className = 'notif-status off';
    toast('Pengingat dimatikan');
  }
}

function startReminderCheck() {
  reminderInterval = setInterval(() => {
    const now = new Date();
    const h = parseInt(document.getElementById('rHour').value);
    const m = parseInt(document.getElementById('rMin').value);
    if (now.getHours() === h && now.getMinutes() === m && now.getSeconds() < 10) {
      const idx = getTodayIdx();
      if (!isDone(idx)) {
        new Notification('🎨 Waktunya Menggambar!', {
          body: `Hari ${idx+1}: ${DAYS[idx].title} — Ayo latihan hari ini!`,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎨</text></svg>'
        });
      }
    }
  }, 10000);
}

// ═══════════════════════ TIMER ═══════════════════════
let timerDuration = 30 * 60;
let timerLeft = timerDuration;
let timerRunning = false;
let timerInterval = null;

function setDuration(min) {
  if (timerRunning) return;
  timerDuration = min * 60;
  timerLeft = timerDuration;
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const m = Math.floor(timerLeft / 60);
  const s = timerLeft % 60;
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  el.className = 'timer-display' + (timerRunning ? ' running' : timerLeft === 0 ? ' done-t' : '');
}

function timerToggle() {
  const btn = document.getElementById('timerStartBtn');
  if (!timerRunning) {
    timerRunning = true;
    if(btn) btn.textContent = '⏸ Pause';
    timerInterval = setInterval(() => {
      timerLeft--;
      updateTimerDisplay();
      if (timerLeft <= 0) {
        timerRunning = false;
        clearInterval(timerInterval);
        if(btn) btn.textContent = '▶ Mulai';
        toast('✅ Waktu latihan selesai!');
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('✅ Timer Selesai!', { body: 'Waktu latihan menggambarmu selesai. Hebat!' });
        }
      }
    }, 1000);
  } else {
    timerRunning = false;
    clearInterval(timerInterval);
    if(btn) btn.textContent = '▶ Lanjut';
  }
}

function timerReset() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerLeft = timerDuration;
  const btn = document.getElementById('timerStartBtn');
  if(btn) btn.textContent = '▶ Mulai';
  updateTimerDisplay();
}

// ═══════════════════════ TOAST ═══════════════════════
let toastTimeout;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

// ═══════════════════════ INIT ═══════════════════════
renderToday();
updateTimerDisplay();
</script>
</body>
</html>
